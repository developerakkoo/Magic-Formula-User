<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" icon="arrow-back-outline"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="app-bg-gradient">
  <div class="forgot-password-container">
    <div class="forgot-password-card" [@fadeInScale]>
      <form [formGroup]="forgotPasswordForm" class="forgot-password-form" *ngIf="!emailSent">
        <!-- Icon Section -->
        <div class="icon-section" [@fadeInUp]>
          <div class="icon-wrapper">
            <ion-icon name="lock-closed-outline" class="main-icon"></ion-icon>
          </div>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section" [@fadeInUp]>
          <h1 class="welcome-title">Forgot Password?</h1>
          <p class="welcome-subtitle">No worries, we'll send you reset instructions</p>
        </div>

        <!-- Form Fields -->
        <div class="form-section">
          <!-- Email Field -->
          <div class="input-wrapper" [@fadeInUp]>
            <label class="input-label">Email</label>
            <div class="input-container">
              <ion-icon name="mail-outline" class="input-icon"></ion-icon>
              <ion-input
                type="email"
                formControlName="email"
                placeholder="Enter your email"
                class="custom-input"
                [clearOnEdit]="true"
              ></ion-input>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-section">
          <ion-button
            expand="block"
            class="send-link-button"
            [disabled]="isLoading || !forgotPasswordForm.valid"
            (click)="handleSendLink()"
            [@fadeInUp]
          >
            <ion-spinner *ngIf="isLoading" name="crescent" class="button-spinner"></ion-spinner>
            <span *ngIf="!isLoading" class="button-text">Send Reset Link</span>
          </ion-button>

          <!-- Back to Login Link -->
          <div class="login-section" [@fadeInUp]>
            <ion-button
              fill="clear"
              size="small"
              class="back-to-login-link"
              (click)="navigateToLogin()"
            >
              <ion-icon name="arrow-back-outline" slot="start"></ion-icon>
              Back to Login
            </ion-button>
          </div>
        </div>
      </form>

      <!-- Success Message -->
      <div class="success-section" *ngIf="emailSent" [@fadeInScale]>
        <div class="success-icon-wrapper" [@fadeInUp]>
          <ion-icon name="checkmark-circle" class="success-icon"></ion-icon>
        </div>
        <div class="success-content" [@fadeInUp]>
          <h2 class="success-title">Check Your Email</h2>
          <p class="success-message">
            Email with password verification link has been sent to your registered email address
          </p>
        </div>
        <ion-button
          expand="block"
          class="back-to-login-button"
          (click)="navigateToLogin()"
          [@fadeInUp]
        >
          Back to Login
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
